name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Mirrors docker-compose.yml: pgvector on pg16, host port 5433. CI-only throwaway credentials.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hirelane
          POSTGRES_PASSWORD: hirelane
          POSTGRES_DB: hirelane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hirelane -d hirelane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hirelane:hirelane@localhost:5433/hirelane
      TEST_DATABASE_URL: postgres://hirelane:hirelane@localhost:5433/hirelane_test
      HIRELANE_LLM_MODE: fixture
      HIRELANE_INGEST_MODE: fixture
      HIRELANE_EMBEDDINGS: hash
      HIRELANE_ENABLE_SUBMIT: '0'
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: pnpm/action-setup reads packageManager from package.json (pnpm@9.12.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docker/initdb only runs in the compose image, so create the test database the same way here.
      - name: Create test database
        run: |
          PGPASSWORD=hirelane psql -h localhost -p 5433 -U hirelane -d hirelane \
            -c 'CREATE DATABASE hirelane_test' || true

      - name: Run migrations
        run: pnpm db:migrate

      - name: Verify
        run: pnpm verify

name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem and when?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This doesn't need scraping or submitting applications on a student's behalf
          required: true

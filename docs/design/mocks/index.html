*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
:root{
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --brico:"Bricolage","Geist",ui-sans-serif,system-ui,sans-serif;
  --dur-state:120ms;--dur-enter:200ms;--dur-exit:160ms;--dur-card:280ms;--dur-story:700ms;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-standard:cubic-bezier(.2,0,0,1);
  --radius-sm:6px;--radius-control:8px;--radius-panel:12px;--radius-card:18px;--radius-phone:28px;--radius-pill:999px;
  --card-lime:#C8FF3D;--card-sun:#FFC83D;--card-blue:#3D5AFE;--card-pink:#FF4FA3;--cream:#FFF6E8;--card-ink:#14161B;
  --mk-h:88px;
}
body{font-family:var(--sans);background:#101215;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}

/* ---------- tokens ---------- */
.t-light{--paper:#F5F6F8;--surface:#FCFCFD;--raised:#EEF0F3;--ink:#14161B;--ink-2:#5B6270;--ink-3:#9AA1AE;--line:#E3E6EB;--line-strong:#C9CED6;--navy:#1B2A4A;--on-navy:#F2F4F8;--accent:#0F5C45;--accent-soft:#E3F1EA;--danger:#B42318;--danger-soft:#FBE9E7;--focus:#1B2A4A;--series-base:#1B2A4A;--series-accent:#0F5C45;--series-2:#5B6270;--series-3:#9AA1AE;--series-track:#ECEEF2;--series-hatch:#C9CED6;--shadow-pop:0 1px 2px rgb(20 22 27/.06),0 8px 24px rgb(20 22 27/.10);color-scheme:light}
.t-dark{--paper:#0E1013;--surface:#15181D;--raised:#1D222B;--ink:#EEF0F4;--ink-2:#8B93A3;--ink-3:#5B6270;--line:#262A31;--line-strong:#3A3F48;--navy:#EEF0F4;--on-navy:#0E1013;--accent:#3CCF8E;--accent-soft:#12301F;--danger:#F87171;--danger-soft:#3A1717;--focus:#EEF0F4;--series-base:#C9CED6;--series-accent:#3CCF8E;--series-2:#8B93A3;--series-3:#5B6270;--series-track:#22262D;--series-hatch:#3A3F48;--shadow-pop:0 1px 0 rgb(255 255 255/.04) inset,0 12px 32px rgb(0 0 0/.5);color-scheme:dark}
.copy-pre .pilot{display:none!important}
.copy-pilot .pre{display:none!important}

/* ---------- mock toolbar (not part of the design) ---------- */
.mk{position:sticky;top:0;z-index:100;background:#17191D;color:#C9CED6;font:500 13px/1 var(--sans);border-bottom:1px solid #2A2E35}
.mk-row{display:flex;align-items:center;gap:12px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.mk-row::-webkit-scrollbar{display:none}
.mk-row+.mk-row{border-top:1px solid #23262C;padding-top:6px;padding-bottom:6px}
.mk-name{color:#EEF0F4;font-weight:600;margin-right:4px}
.mk-seg{display:inline-flex;background:#0F1114;border:1px solid #2A2E35;border-radius:8px;padding:2px;flex:none}
.mk-seg button{border:0;background:none;color:#9AA1AE;padding:6px 10px;border-radius:6px;cursor:pointer}
.mk-seg button[aria-pressed=true]{background:#262A31;color:#EEF0F4}
.mk-gap{flex:1 0 8px}
.mk-lbl{color:#8B93A3}
.mk-pages a{color:#9AA1AE;text-decoration:none;padding:5px 9px;border-radius:6px;flex:none}
.mk-pages a[aria-current=page]{color:#EEF0F4;background:#262A31}
.mk-opt[hidden]{display:none}

/* ---------- shared atoms ---------- */
.shell{container:shell/inline-size;background:var(--paper);color:var(--ink);min-height:calc(100vh - var(--mk-h));font-size:16px;line-height:1.5}
.wm{font:600 20px/1 var(--sans);letter-spacing:-.02em;color:var(--ink);text-decoration:none;white-space:nowrap}
.wm span{color:var(--accent)}
.btn{--h:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 16px;border-radius:var(--radius-control);font:500 14px/1 var(--sans);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform var(--dur-state) var(--ease-standard),background-color var(--dur-state) var(--ease-standard)}
.btn:hover{background:var(--raised)}
.btn.p{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.p:hover{background:color-mix(in srgb,var(--navy) 94%,var(--paper))}
.btn:active{transform:translateY(1px)}
.btn.sm{--h:34px;padding:0 12px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tlink{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);text-decoration:none;font-size:15px}
.tlink svg{width:16px;height:16px;transition:transform var(--dur-state) var(--ease-standard)}
.tlink:hover svg{transform:translateX(2px)}
.small{font-size:13px;line-height:1.45;font-weight:500;letter-spacing:.005em;color:var(--ink-2)}
.ink2{color:var(--ink-2)}
.acc{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--radius-sm);font:500 12px/1 var(--sans);border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.chip.met{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--radius-pill);font:500 12px/1 var(--sans);white-space:nowrap}
.pill.offer{background:var(--ink);color:var(--paper)}
.pill.intv{border:1px solid var(--ink);color:var(--ink)}
.pill.appl{border:1px solid var(--line-strong);color:var(--ink-2)}
.pill.new{border:1px solid var(--ink);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--series-2);flex:none;display:inline-block}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.s16{width:16px;height:16px}
.glyph{display:inline-grid;place-items:center;width:20px;height:20px;flex:none;font-weight:600;font-size:15px;line-height:1}
.g-ok{color:var(--accent)}
.g-un{color:var(--ink-2)}
.g-no{color:var(--danger)}
[data-surface=app] .g-ok,[data-surface=app] .g-no{color:var(--ink)}
.hidden-d[open] summary svg{transform:rotate(90deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel)}
.rows>*+*{border-top:1px solid var(--line)}
.rowlink{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:56px}
.rowlink:hover{background:var(--raised)}
.rowlink .rl-main{flex:1;min-width:0}
.rowlink .rl-t{font-weight:500;font-size:15px}
.rowlink .rl-m{font-size:14px;color:var(--ink-2);line-height:1.45}

/* ---------- role card ---------- */
.rc{--ink:#14161B;--ink-2:rgb(20 22 27/.7);--line:rgb(20 22 27/.16);--fg:var(--card-ink);--fg2:rgb(20 22 27/.7);position:relative;background:var(--fill);color:var(--fg);border:1px solid var(--card-ink);border-radius:var(--radius-card);padding:20px;display:grid;gap:14px;touch-action:pan-y;user-select:none;-webkit-user-select:none}

/* ---------- site ---------- */

/* landing story stage */
.stage-wrap{margin-top:48px}
.stage{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,4fr) minmax(0,4fr);gap:24px;background:var(--raised);border-radius:var(--radius-panel);padding:32px;height:540px;overflow:hidden;position:relative}

.st-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel)}

.st-verdict{font-weight:600;font-size:15px;padding:12px 14px;border-top:1px solid var(--line)}
.st-track{-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.tr-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;font-size:14px}
.tr-row+.tr-row{border-top:1px solid var(--line)}

.stage-cap{display:flex;justify-content:space-between;gap:16px;margin-top:12px;align-items:center}
.replay{display:inline-flex;gap:6px;align-items:center;border:0;background:none;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;padding:6px 0;min-height:32px}
.replay svg{width:16px;height:16px}
.stage .anim{opacity:1}
.stage.play .s-card{animation:s-in var(--dur-story) var(--ease-out) both}
.stage.play .s-r1 .ok,.stage.play .s-r2 .ok,.stage.play .s-r3 .ok{animation:s-tick 400ms var(--ease-out) both}
.stage.play .s-r1 .ok{animation-delay:900ms}.stage.play .s-r2 .ok{animation-delay:1600ms}.stage.play .s-r3 .ok{animation-delay:2300ms}
.stage.play .s-r1 .pend{animation:s-out 1ms 900ms both}.stage.play .s-r2 .pend{animation:s-out 1ms 1600ms both}.stage.play .s-r3 .pend{animation:s-out 1ms 2300ms both}
.stage.play .s-r1 .txt{animation:s-dim 300ms 900ms both}.stage.play .s-r2 .txt{animation:s-dim 300ms 1600ms both}.stage.play .s-r3 .txt{animation:s-dim 300ms 2300ms both}
.stage.play .s-verdict{animation:s-in var(--dur-story) 2900ms var(--ease-out) both}
.stage .s-card .stamp:not(.skip){opacity:1;transform:rotate(-8deg) scale(1)}
.stage.play .s-card .stamp:not(.skip){animation:s-stamp 120ms 3700ms var(--ease-out) both}
.stage.play .s-receipt{animation:s-in var(--dur-story) 3900ms var(--ease-out) both}
.stage.play .s-reply{animation:s-in var(--dur-story) 4700ms var(--ease-out) both}
@keyframes s-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- auth surface (approved, as captured) ---------- */

.au-h{font:800 clamp(44px,calc(30px + 3.4cqi),80px)/.95 var(--brico);letter-spacing:-.045em}

.au-card-w{position:relative}

.au-in-field{height:50px;border:2px solid #0B0B0F;border-radius:12px;padding:0 16px;font:400 16px var(--brico);background:#FFFCF6;width:100%}
.au-btn{height:52px;border-radius:999px;border:2px solid #0B0B0F;background:var(--card-lime);color:#0B0B0F;font:700 16px/1 var(--brico);display:flex;gap:10px;align-items:center;justify-content:center;width:100%;cursor:pointer}
.au-btn.o{background:transparent}
.au-or{display:flex;align-items:center;gap:12px;color:#6A645B;font-size:14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:#D7CDBC}
.au-note{font-size:14px!important}
.au-link{font-weight:600;color:#0B0B0F;text-underline-offset:3px;font-size:15px}
.au-foot{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:rgb(255 246 232/.62)}
.au-addr{font-family:var(--mono);font-size:14px;background:#F2E8D8;border-radius:8px;padding:10px 12px;color:#0B0B0F;word-break:break-all}
.au-opt{border:2px solid #D7CDBC;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:#FFFCF6}
.au-opt.on{border-color:#0B0B0F}
.au-opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid #0B0B0F;flex:none;margin-top:2px;display:grid;place-items:center}
.au-opt.on .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:#0B0B0F}
.au-opt b{display:block;font-weight:600;font-size:15px}
.au-opt span{font-size:14px;color:#4A4640}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;border:2px solid #0B0B0F;border-radius:12px;overflow:hidden}

@container shell (max-width:900px){.au-main{grid-template-columns:minmax(0,1fr);gap:28px;padding:24px 0 40px;align-items:start}.au-card-w::before{inset:12px -6px -14px 10px}.au-card{padding:22px}.au-sub{margin-top:12px;font-size:16px}}

/* ---------- student app ---------- */

  .a-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;z-index:6;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}

  .a-tabs a[aria-current=page]{color:var(--accent)}
  .a-tabs a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--accent)}
  .a-tabs .bdg{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:10px;display:grid;place-items:center;padding:0 4px}
}
.home{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:start}
@container shell (max-width:900px){.home{grid-template-columns:minmax(0,1fr);gap:24px}}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.bars i{height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.bars i.on::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(.35)}
.deck{position:relative;outline:none;margin-bottom:32px}
.deck .ghost{position:absolute;inset:0;transform-origin:50% 100%;border:1px solid var(--card-ink);background:var(--fill,var(--surface));border-radius:var(--radius-card)}
.ghost.lime{--fill:var(--card-lime)}.ghost.sun{--fill:var(--card-sun)}.ghost.blue{--fill:var(--card-blue)}.ghost.pink{--fill:var(--card-pink)}
.deck .g1{transform:translateY(10px) scale(.96);z-index:1}

.deck-acts{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:8px}
.deck-acts .btn{--h:44px}
.deck-acts .btn.p{min-width:0}
.mode{font-size:13px;color:var(--ink-2);margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.toast-slot{display:grid;margin-top:8px;position:relative}
.toast-slot:not(:has(.toast.on)) .toast{position:absolute;left:0;right:0;top:0}
.toast-slot>*{grid-area:1/1}
.toast-slot .hint{padding-top:2px;transition:opacity var(--dur-state)}
.toast-slot:has(.toast.on) .hint{opacity:0}
.toast{position:relative;align-self:start;background:var(--card-ink);color:var(--cream);border-radius:var(--radius-panel);padding:12px 12px 12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--dur-exit) var(--ease-in),transform var(--dur-exit) var(--ease-in);overflow:hidden;z-index:4}
.toast.on{opacity:1;transform:none;pointer-events:auto;transition:opacity var(--dur-enter) var(--ease-out),transform var(--dur-enter) var(--ease-out)}
.toast b{font-weight:500;font-size:14px}
.toast span{font-size:13px;color:rgb(255 246 232/.74);grid-column:1}

.toast .undo:hover{background:rgb(255 246 232/.08)}

.toast.on .cd{animation:cd 4s linear both}

@keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.rp{overflow:hidden}

  if(PAGES[s]){st.surface=s; st.page=PAGES[s].some(x=>x[0]===p)?p:PAGES[s][0][0];}
  new URLSearchParams(q||'').forEach((v,k)=>{if(k in st)st[k]=v});
}
function href(s,p){const q=new URLSearchParams();if(st.frame!=='desktop')q.set('frame',st.frame);if(st.theme!=='light')q.set('theme',st.theme);if(st.ctheme!=='dark')q.set('ctheme',st.ctheme);if(st.copy!=='pilot')q.set('copy',st.copy);const qs=q.toString();return `#/${s}/${p}${qs?'?'+qs:''}`}
function go(){location.hash=href(st.surface,st.page)}

function toolbar(){
  $$('#mk-surface button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st.surface));
  $$('#mk-frame button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.frame));
  const th=st.surface==='console'?st.ctheme:st.theme;
  $$('#mk-theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===th));
  $$('#mk-copy button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.copy));
  $$('.mk-opt').forEach(o=>o.hidden=!o.dataset.for.split(' ').includes(st.surface));
  $('#mk-pages').innerHTML=PAGES[st.surface].map(([id,t])=>`<a href="${href(st.surface,id)}" ${id===st.page?'aria-current="page"':''}>${t}</a>`).join('');
  document.documentElement.style.setProperty('--mk-h',$('#mk').offsetHeight+'px');
}
$('#mk-surface').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.surface=b.dataset.s;st.page=PAGES[st.surface][0][0];if(st.surface==='app')st.page='home-ab';go()};
$('#mk-frame').onclick=e=>{const b=e.target.closest('button');if(b){st.frame=b.dataset.v;go()}};
$('#mk-theme').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(st.surface==='console')st.ctheme=b.dataset.v;else st.theme=b.dataset.v;go()};
$('#mk-copy').onclick=e=>{const b=e.target.closest('button');if(b){st.copy=b.dataset.v;go()}};

/* ---------- hydrate ---------- */
function hydrate(root){
  $$('i[data-i]',root).forEach(i=>{const c=i.classList.contains('s16')?'ic s16':'ic';i.outerHTML=ic(i.dataset.i,c)});
  $$('[data-card]',root).forEach(el=>{el.innerHTML=card(el.dataset.card,{compact:el.dataset.compact});if(el.dataset.stamp&&!el.classList.contains('s-card')){const s=$('.stamp',el);s.style.opacity=1;s.style.transform='rotate(-8deg) scale(1)'}});
  root.addEventListener('click',e=>{const f=e.target.closest('.rc-fit');if(f){const c=f.closest('.rc');c.classList.toggle('open');f.setAttribute('aria-expanded',c.classList.contains('open'))}});
  $$('[data-stage]',root).forEach(initStage);
  $$('[data-rules]',root).forEach(el=>el.innerHTML=rulesHTML('trellis'));
  $$('[data-deck]',root).forEach(initDeck);
  $$('[data-chart]',root).forEach(initChart);
  $$('[data-totals]',root).forEach(el=>el.innerHTML=totals());
  $$('[data-sbar]',root).forEach(el=>el.innerHTML=sbar(el.dataset.sbar==='act'));
  $$('[data-tt]',root).forEach(initTT);
  $$('[data-st]',root).forEach(initST);
  $$('[data-acc]',root).forEach(initAcc);
  $$('[data-share]',root).forEach(initShare);
  $$('[data-pilotform]',root).forEach(el=>el.innerHTML=pilotForm());
  $$('[data-parse]',root).forEach(initParse);
  $$('a[href="#pilot-form"]',root).forEach(a=>a.onclick=e=>{e.preventDefault();$('#pilot-form',root).scrollIntoView()});
}
function rulesHTML(k){return CARDS[k].rules.map(r=>`<div class="vrow"><span class="glyph ${G[r[0]][1]}">${G[r[0]][0]}</span><span>${r[1]}${r[2]?`<small>${r[2]}</small>`:''}</span></div>`).join('')}

function initStage(s){
  const play=()=>{s.classList.remove('play');void s.offsetWidth;s.classList.add('play')};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){play();io.disconnect()}},{threshold:.3});io.observe(s);
  const r=s.parentElement.querySelector('[data-replay]'); if(r)r.onclick=play;
}

/* ---------- deck ---------- */
function initDeck(host){
  const order=['trellis','ankur','saarthi']; let i=0; const hist=[];
  const page=host.closest('.a-main'); const isApplied=st.page==='applied'&&host.dataset.deck==='picks';
  host.innerHTML=`<div class="deck" tabindex="0" aria-label="Today’s picks. Left arrow skips, right arrow applies, up arrow saves."><div class="ghost g2"></div><div class="ghost g1"></div><div class="slot"></div></div>
   <div class="deck-acts"><button class="btn" data-a="skip">${ic('x','ic s16')}Skip</button><button class="btn" data-a="save">${ic('plus','ic s16')}Save</button><button class="btn p" data-a="apply">${ic('check','ic s16')}<span class="pilot">Apply</span><span class="pre">Get it ready</span></button></div>
   <p class="mode"><span class="pilot">Applies from</span><span class="pre">Ready from</span><span class="mono">rahul.k3x@apply.hirelane.in</span></p>
   <div class="toast-slot"><p class="hint">Drag the card, use the buttons, or press the arrow keys.</p><div class="toast" role="status"><b></b><span></span><button class="undo">Undo</button><i class="cd"></i></div></div>`;
  const deck=$('.deck',host), slot=$('.slot',deck), toast=$('.toast',host); let tmr;
  const count=page&&$('[data-count]',page), bars=page&&$$('.bars i',page), side=page&&$('[data-rules]',page);
  function show(){
    const k=order[i];
    if(!k){slot.innerHTML=`<div class="panel" style="padding:24px;border-radius:var(--radius-card)"><div class="c-h">That’s today’s picks.</div><p class="ink2" style="margin-top:6px">New roles you qualify for show up here each morning.</p></div>`;$$('.ghost',deck).forEach(g=>g.style.display='none');return}
    slot.innerHTML=card(k); $$('.ghost',deck).forEach((g,n)=>{const nk=order[i+2-n];g.style.display=nk?'':'none';g.className='ghost g'+(2-n)+(nk?' '+CARDS[nk].fill:'')});
    if(count)count.textContent=`${i+1} of ${order.length}`; if(bars)bars.forEach((b,n)=>b.classList.toggle('on',n===i));
    if(side)side.innerHTML=rulesHTML(k);
    const an=page&&$('[data-ans]',page); if(an){const a=CARDS[k].ans; an.innerHTML=a[2]?`<div class="rl-main"><div class="rl-t">Answers ready: ${a[0]} of ${a[1]}</div><div class="rl-m">Needs you: ${a[2].charAt(0).toLowerCase()+a[2].slice(1)}</div></div><span class="btn sm">Answer</span>`:`<div class="rl-main"><div class="rl-t">Answers ready: ${a[0]} of ${a[1]}</div><div class="rl-m">Nothing needs you before you apply.</div></div>`}
    const rd=page&&$('[data-rounds]',page); if(rd)rd.textContent=CARDS[k].rounds;
    bind($('.rc',slot));
  }
  function toastShow(kind,k){
    const d=CARDS[k]; clearTimeout(tmr);
    const pre=st.copy==='pre';
    const t={apply:[pre?`Ready: ${d.role}, ${d.co}`:`Applied: ${d.role}, ${d.co}`,pre?'Open their form to submit. Your answers are ready.':'Sends from your Hirelane address in 4 seconds'],skip:[`Skipped ${d.co}`,'Moved to Not this time in Discover'],save:[`Saved ${d.role}`,'It’s in Tracker, Saved']}[kind];
    $('b',toast).textContent=t[0]; $('span',toast).textContent=t[1];
    toast.classList.remove('on','frozen'); void toast.offsetWidth; toast.classList.add('on');
    $('#live').textContent=kind==='apply'?`${pre?'Ready':'Applied'} to ${d.role} at ${d.co}. Undo available for 4 seconds.`:t[0]+'. Undo available.';
    if(!isApplied)tmr=setTimeout(()=>toast.classList.remove('on'),4000);
  }
  function commit(kind,el){
    const w=deck.offsetWidth; const k=order[i];
    const dir=kind==='skip'?-1:kind==='apply'?1:0;
    el.style.transition=`transform var(--dur-card) var(--ease-out),opacity var(--dur-card) var(--ease-out)`;
    if(kind==='apply'){const s=$('.stamp:not(.skip)',el);s.style.transition='opacity 120ms, transform 120ms';s.style.opacity=1;s.style.transform='rotate(-8deg) scale(1)'}
    el.style.transform=dir?`translateX(${dir*1.2*w}px) rotate(${dir*12}deg)`:`translateY(-60%) scale(.9)`; el.style.opacity=dir?1:0;
    hist.push(i); setTimeout(()=>{i++;show()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:280);
    toastShow(kind,k);
  }
  function bind(el){
    let x0=null,dx=0; const w=()=>deck.offsetWidth;
    const sa=$('.stamp:not(.skip)',el), ss=$('.stamp.skip',el);
    el.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.transition='none'});
    el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/w()*12}deg)`;const p=Math.min(1,Math.abs(dx)/(w()*.35));(dx>0?sa:ss).style.opacity=p;(dx>0?ss:sa).style.opacity=0;(dx>0?sa:ss).style.transform=`rotate(${dx>0?-8:8}deg) scale(${1.08-.08*p})`});
    const up=()=>{if(x0===null)return;x0=null;if(dx>w()*.35)commit('apply',el);else if(dx<-w()*.35)commit('skip',el);else{el.style.transition='transform var(--dur-enter) var(--ease-out)';el.style.transform='';sa.style.opacity=0;ss.style.opacity=0}};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  $('.deck-acts',host).onclick=e=>{const b=e.target.closest('button');const el=$('.rc',slot);if(b&&el)commit(b.dataset.a,el)};
  deck.onkeydown=e=>{const el=$('.rc',slot);if(!el)return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('.undo',toast).click();return}const m={ArrowLeft:'skip',ArrowRight:'apply',ArrowUp:'save'}[e.key];if(m){e.preventDefault();commit(m,el)}else if(e.key===' '){e.preventDefault();$('.rc-fit',el).click()}};
  $('.undo',toast).onclick=()=>{if(!hist.length)return;clearTimeout(tmr);toast.classList.remove('on');i=hist.pop();show();const el=$('.rc',slot);el.style.transition='none';el.style.transform='translateY(-12px)';el.style.opacity=0;void el.offsetWidth;el.style.transition='transform var(--dur-enter) var(--ease-out),opacity var(--dur-enter) var(--ease-out)';el.style.transform='';el.style.opacity=1;deck.focus({preventScroll:true})};
  show();
  if(isApplied){hist.push(0);i=1;show();toastShow('apply','trellis');toast.classList.add('frozen')}
}

/* ---------- console data ---------- */
const WEEKS=['4 Aug','11 Aug','18 Aug','25 Aug','1 Sep','8 Sep','15 Sep','22 Sep','29 Sep','6 Oct','13 Oct','20 Oct','27 Oct'];
const APPS=[38,52,36,60,74,66,58,90,104,96,112,120,132];
const REPS=[null,null,null,null,11,10,12,14,17,15,19,22,24];
const MARK={3:'Academic Counsellor, Medhaa Learning closed',7:'Claims Associate, Neelgiri Insurance closed',11:'Data Entry Operator, Pathway Freight closed'};
function initChart(el){
  const tip=document.createElement('div');tip.className='tip';
  const draw=()=>{
    const W=el.clientWidth,H=el.clientHeight; if(!W)return;
    const pl=34,pr=4,pt=22,pb=24,iw=W-pl-pr,ih=H-pt-pb,max=140,n=APPS.length,gw=iw/n,bw=Math.max(4,Math.min(14,gw*.3)),gap=2;
    const y=v=>pt+ih-(v/max)*ih;
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="Weekly applications and replies, 4 Aug to 27 Oct"><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="none"/><line x1="0" y1="0" x2="0" y2="4" stroke="var(--series-hatch)" stroke-width="2"/></pattern></defs>`;
    [0,70,140].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--ink-2)" font-weight="500" style="font-variant-numeric:tabular-nums">${v}</text>`});
    const step=W<500?3:2;
    APPS.forEach((a,i)=>{
      const cx=pl+gw*i+gw/2;
      s+=`<rect x="${cx-bw-gap/2}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" rx="2" fill="var(--series-base)"/>`;
      const r=REPS[i];
      if(r==null)s+=`<rect x="${cx+gap/2}" y="${y(10)}" width="${bw}" height="${y(0)-y(10)}" fill="url(#hatch)" stroke="var(--series-hatch)" stroke-width="1"/>`;
      else s+=`<rect x="${cx+gap/2}" y="${y(r)}" width="${bw}" height="${y(0)-y(r)}" rx="2" fill="var(--series-accent)"/>`;
      if(MARK[i])s+=`<circle cx="${cx}" cy="${pt-12}" r="3.5" fill="var(--ink-2)"/>`;
      if(i%step===0)s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="12" font-weight="500" fill="var(--ink-2)">${WEEKS[i]}</text>`;
    });
    s+=`<line class="xh" x1="0" x2="0" y1="${pt-4}" y2="${y(0)}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/><rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg>`;
    el.innerHTML=s; el.appendChild(tip);
    const xh=$('.xh',el), hit=$('.hit',el);
    hit.onpointermove=e=>{const r=el.getBoundingClientRect();const i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-pl)/gw)));const cx=pl+gw*i+gw/2;
      xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity',1);
      tip.innerHTML=`<b>Week of ${WEEKS[i]}</b><div><span>Applications</span><span>${APPS[i]}</span></div><div><span>Replies</span><span>${REPS[i]==null?'under 10':REPS[i]}</span></div>${MARK[i]?`<div><span>${MARK[i]}</span></div>`:''}`;
      tip.classList.add('on');const tw=tip.offsetWidth;tip.style.left=Math.min(W-tw,Math.max(0,cx+12>W-tw?cx-tw-12:cx+12))+'px';tip.style.top='8px'};
    hit.onpointerleave=()=>{tip.classList.remove('on');xh.setAttribute('opacity',0)};
  };
  new ResizeObserver(draw).observe(el); draw();
}
